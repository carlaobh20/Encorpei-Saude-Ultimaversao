<html lang="pt-BR">

    <meta name="description" content="Acompanhamento cardiológico contínuo: pressão, batimentos, sono, atividade, remédios e canal direto com seu cardiologista." />

    <!-- PWA / Standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Encorpei Cardio" />
    <meta name="theme-color" content="#F2F5F9" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Encorpei Cardio" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Encorpei Cardio — Seu coração acompanhado todos os dias" />
    <meta property="og:description" content="Pressão, batimentos, sono, atividade e remédios — acompanhados pelo seu cardiologista." />
    <meta property="og:image" content="/logo-full.png" />
    <!-- Dimensões declaradas porque a logo-full foi redesenhada para 1200x630
         (a antiga era quadrada, da marca de maternidade, e o Facebook/WhatsApp
         recortava o wordmark). Sem width/height o primeiro compartilhamento
         renderiza sem imagem enquanto o crawler não baixa o arquivo. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Encorpei Cardio — coração com traçado de eletrocardiograma" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Encorpei Cardio — Seu coração acompanhado todos os dias" />
    <meta name="twitter:description" content="Acompanhamento cardiológico para pacientes e cardiologistas." />
    <meta name="twitter:image" content="/logo-full.png" />
    <meta name="twitter:image:alt" content="Encorpei Cardio — coração com traçado de eletrocardiograma" />
