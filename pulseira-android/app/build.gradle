plugins {
    id "com.android.application"
}

android {
    namespace "saude.encorpei.pulseira"
    compileSdk 34

    defaultConfig {
        applicationId "saude.encorpei.pulseira"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.7.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
